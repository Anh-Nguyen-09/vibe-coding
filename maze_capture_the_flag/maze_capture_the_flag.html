<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Maze Capture the Flag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Be+Vietnam+Pro:wght@600&display=swap" rel="stylesheet">
<style>
/* One fixed 960x540 landscape stage scaled to fit: HUD on top, whole dungeon maze in the middle (fog hides what you have not seen), controls at the bottom. */
:root{color-scheme:dark;--ink:#0c1130;--panel:#151c47;--panel2:#1e2760;--line:#3a4aa0;--gold:#f3c75a;--gold2:#b98b2c;--text:#eef2ff;--dim:#97a4da;--p1:#4fb0ff;--p2:#ff6b8f;
--px:'Press Start 2P',ui-monospace,Menlo,monospace;--vt:'VT323','Be Vietnam Pro',ui-monospace,Menlo,monospace}
html{box-sizing:border-box;height:100%;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--vt);font-size:20px;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
#wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hint{font-size:20px;color:var(--gold);text-align:center}
#stage{position:relative;overflow:hidden;background:#000;flex:none}
#game{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;left:0;top:0;width:960px;height:540px;image-rendering:pixelated}
button{font-family:var(--vt);color:var(--text);cursor:pointer;touch-action:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{cursor:default}
.gold{border:0;border-bottom:5px solid var(--gold2);background:var(--gold);color:#2a1d00;font-size:28px;line-height:1;white-space:nowrap;padding:0 22px;height:42px}
.gold:hover{filter:brightness(1.08)}.gold:active{transform:translateY(2px);border-bottom-width:3px}
.gold:disabled{background:#59608f;border-bottom-color:#3b4170;color:#d3d8f5}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,9,28,.82);z-index:6}
.box{background:var(--panel);border:3px solid var(--gold);padding:16px 22px;text-align:center}
.t1{font:400 22px var(--px);color:var(--gold);text-shadow:0 3px 0 #6b4d10;margin:0 0 8px;letter-spacing:1px}
.t2{font-size:22px;color:var(--dim);line-height:1.12;margin:4px 0}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;text-align:left;margin:10px 0 14px;width:800px}
.rules div{background:var(--panel2);border:2px solid #34419a;padding:5px 9px;font-size:20px;line-height:1.08}
.rules b{color:var(--gold);font-weight:400}
#pre{position:absolute;left:0;right:0;top:0;height:50px;background:rgba(12,17,48,.96);border-bottom:3px solid var(--line);display:flex;align-items:center;justify-content:center;gap:14px;z-index:3}
#pre .ptitle{font-size:24px;line-height:1;white-space:nowrap;color:var(--p1)}
#sel{position:absolute;inset:0;background:linear-gradient(180deg,#0e1540,#0a0f2c);z-index:4;padding:10px 20px;text-align:center}
#sel h2{margin:0;font:400 18px var(--px);color:var(--gold)}
.orow{margin:6px 0}.olab{font:400 20px var(--vt,inherit);text-align:left;margin:0 0 3px 6px}
.oslots{display:flex;gap:6px;justify-content:flex-start}
.os{width:118px;height:128px;background:var(--panel2);border:3px solid #2c3880;padding:2px 2px;font-size:20px;line-height:1.05;display:flex;flex-direction:column;align-items:center;gap:0}
.os em{font-style:normal;font-size:15px;color:var(--dim)}.os.lead em{color:var(--gold)}.os.lead{border-color:#8a7a2a}
.os canvas{width:56px;height:56px;image-rendering:pixelated}.os span{font-size:18px;white-space:nowrap}.os small{font-size:16px}
.os:hover{border-color:#6f7bff}.os.on{border-color:var(--gold);background:#2b3786}
#bsw.alarm{animation:alm .5s infinite alternate;border-color:#ff4d4d}@keyframes alm{from{background:#5a1020}to{background:#c02a3a}}
.slots{display:flex;gap:12px;justify-content:center;margin:8px 0}
.slotb{width:330px;height:46px;background:var(--panel2);border:3px solid #34419a;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.slotb.on{border-color:var(--gold);background:#2b3786}
.slotb canvas{width:34px;height:34px;image-rendering:pixelated}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:800px;margin:0 auto}
.pb{height:70px;background:var(--panel2);border:3px solid #2c3880;padding:0;display:flex;align-items:center;gap:6px;padding:2px 6px;text-align:left;font-size:20px;line-height:1.02}
.pb canvas{width:52px;height:52px;image-rendering:pixelated;flex:none}
.pb small{display:block;font-size:16px;color:var(--dim)}
.pb:hover{border-color:#6b7ce0}
.pb.a{border-color:#ffb24d;background:#4a3a2a}.pb.d{border-color:#5ab0ff;background:#233a6a}
#bar{position:absolute;left:0;right:0;top:440px;height:100px;background:rgba(12,17,48,.97);border-top:3px solid var(--line);z-index:3}
#dpad{position:absolute;left:10px;top:6px;width:96px;height:88px;display:grid;grid-template-columns:repeat(3,32px);grid-template-rows:repeat(3,29px)}
#dpad button{background:var(--panel2);border:2px solid #34419a;font-size:18px;padding:0;line-height:1}
#dpad button.on,#dpad button:active{background:#3a4590;border-color:var(--gold)}
#roster{position:absolute;left:118px;top:4px;width:490px;height:92px;display:flex;gap:10px}
.rg{padding:2px 4px;border:2px solid #2c3880;background:#111847}
.rg.ctl{border-color:var(--gold);background:#242d6e}
.rg .rt{font-size:17px;line-height:1;color:var(--dim);white-space:nowrap;margin-bottom:2px;display:flex;justify-content:space-between}
.rg.ctl .rt{color:var(--gold)}
.rg .rm{display:flex;gap:2px}
.rm .ru{position:relative;width:34px;height:44px;background:#0c1130;border:2px solid #2c3880;padding:0}
.rm .ru.ld{border-color:#f3c75a}
.rm .ru canvas{width:30px;height:32px;display:block;image-rendering:pixelated}
.rm .ru u{position:absolute;left:1px;right:1px;bottom:1px;height:4px;background:#000;display:block}
.rm .ru u s{display:block;height:100%;background:#59d17f;text-decoration:none}
.rm .ru.dead{opacity:.25}
.rm .ru.cr::after{content:'';position:absolute;left:50%;top:-1px;width:6px;height:5px;margin-left:-3px;background:#f3c75a}
#acts{position:absolute;left:616px;top:6px;width:336px;height:88px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr 1fr;gap:4px}
#acts button{background:var(--panel2);border:2px solid #34419a;font-size:19px;line-height:1;white-space:nowrap;padding:0 2px;min-width:0;overflow:hidden}
#acts button:hover{border-color:#fff}
#acts button.on{border-color:var(--gold);background:#4a3a2a;color:var(--gold)}
#acts button.hot{border-color:#ffb24d}
.lc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;max-width:700px}
.lb{width:128px;background:var(--panel2);border:3px solid #34419a;padding:6px 4px;font-size:20px;line-height:1.05;display:flex;flex-direction:column;align-items:center;gap:2px}
.lb canvas{width:56px;height:56px;image-rendering:pixelated}
.lb small{font-size:16px;color:var(--dim)}
.lb:hover{border-color:var(--gold);background:#2b3786}
.lb u{display:block;width:90%;height:5px;background:#000;text-decoration:none}
.lb u s{display:block;height:100%;background:#59d17f;text-decoration:none}
.mini{height:24px;padding:0 8px;background:var(--panel2);border:2px solid var(--line);font-size:17px;line-height:1;white-space:nowrap}
.mini:hover{border-color:var(--gold)}.mini.on{border-color:var(--gold);color:var(--gold)}
#speed{position:absolute;right:6px;top:56px;display:flex;gap:3px;z-index:3}
#tip{position:absolute;pointer-events:none;background:rgba(12,17,48,.95);border:2px solid var(--gold);padding:4px 8px;font-size:19px;line-height:1.05;z-index:7;max-width:240px}
</style>
<div id="wrap">
  <div id="hint" hidden>Rotate your phone sideways for a better view.</div>
  <div id="stage"><div id="game">
    <canvas id="cv" width="1920" height="1080"></canvas>
    <div id="pre" hidden></div>
    <div id="sel" hidden></div>
    <div id="bar" hidden>
      <div id="dpad"><span></span><button data-k="u" type="button" aria-label="Up">▲</button><span></span><button data-k="l" type="button" aria-label="Left">◀</button><span></span><button data-k="r" type="button" aria-label="Right">▶</button><span></span><button data-k="d" type="button" aria-label="Down">▼</button><span></span></div>
      <div id="roster"></div>
      <div id="acts"><button id="bsw" type="button"></button><button id="bin" type="button">Interact (E)</button><button id="brt" type="button">Retreat (R)</button><button id="bat" type="button">Attack (F)</button></div>
    </div>
    <div id="speed" hidden></div>
    <div id="tip" hidden></div>
    <div id="intro" class="ov" hidden></div>
    <div id="lead" class="ov" hidden></div>
    <div id="result" class="ov" hidden></div>
  </div></div>
</div>

const ROOMDEF=[[0,2,0,1],[0,2,4,5],[1,3,2,3],[4,5,0,1],[4,5,4,5],[6,8,2,3],[12,14,0,1],[12,14,4,5],[11,13,2,3],[9,10,0,1],[9,10,4,5]];
const RMIR=[6,7,8,9,10,5,0,1,2,3,4];
const RNAME=['Library','Dungeon','Treasury','Observatory','Wine Cellar','Great Hall','Library','Dungeon','Treasury','Observatory','Wine Cellar'];
const tcx=tx=>OX+tx*TS+TS/2, tcy=ty=>OY+ty*TS+TS/2;
const tileX=x=>Math.floor((x-OX)/TS), tileY=y=>Math.floor((y-OY)/TS);
let MZ=null;
function genMaze(){
  const T=new Uint8Array(MW*MH).fill(1);
  const id=(c,r)=>r*CW+c,par=[...Array(CW*CH).keys()];
  const find=a=>{while(par[a]!==a){par[a]=par[par[a]];a=par[a];}return a;};
  const uni=(a,b)=>{par[find(a)]=find(b);};
  const ek=(a,b)=>a<b?a+'-'+b:b+'-'+a;
  const open=new Set();
  const mir=a=>{const c=a%CW,r=(a/CW)|0;return id(14-c,r);};
  const rooms=ROOMDEF.map((d,i)=>({i,c0:d[0],c1:d[1],r0:d[2],r1:d[3],x0:2*d[0]+1,x1:2*d[1]+1,y0:2*d[2]+1,y1:2*d[3]+1,name:''}));
  rooms.forEach(rm=>{rm.cx=(rm.x0+rm.x1)/2;rm.cy=(rm.y0+rm.y1)/2;rm.num=rm.i===5?'C':String(rm.i<5?rm.i+1:rm.i);rm.name=rm.i===5?'Great Hall':'Room '+rm.num;for(let r=rm.r0;r<=rm.r1;r++)for(let c=rm.c0;c<=rm.c1;c++)uni(id(c,r),id(rm.c0,rm.r0));});
  const edges=[];
  for(let r=0;r<CH;r++)for(let c=0;c<7;c++)edges.push([id(c,r),id(c+1,r)]);
  for(let r=0;r<CH-1;r++)for(let c=0;c<8;c++)edges.push([id(c,r),id(c,r+1)]);
  const add=e=>{open.add(ek(e[0],e[1]));open.add(ek(mir(e[0]),mir(e[1])));uni(e[0],e[1]);uni(mir(e[0]),mir(e[1]));};
  shuffle(edges).forEach(e=>{if(find(e[0])!==find(e[1]))add(e);});
  const comps=()=>new Set([...Array(CW*CH).keys()].map(find)).size;
  while(comps()>1){for(const e of shuffle(edges)){if(find(e[0])!==find(e[1])){add(e);break;}}}
  let extra=0;for(const e of shuffle(edges)){if(extra>=9)break;if(!open.has(ek(e[0],e[1]))){const same=ROOMDEF.some((d,i)=>{const rm=rooms[i];const cs=[e[0]%CW,e[1]%CW],rs=[(e[0]/CW)|0,((e[1])/CW)|0];return cs.every(c=>c>=rm.c0&&c<=rm.c1)&&rs.every(r=>r>=rm.r0&&r<=rm.r1);});if(!same){add(e);extra++;}}}
  for(let c=0;c<CW;c++)for(let r=0;r<CH;r++)T[(2*r+1)*MW+2*c+1]=0;
  for(const k of open){const [a,b]=k.split('-').map(Number);const ca=a%CW,ra=(a/CW)|0,cb=b%CW,rb=(b/CW)|0;T[(ra+rb+1)*MW+(ca+cb+1)]=0;}
  rooms.forEach(rm=>{for(let y=rm.y0;y<=rm.y1;y++)for(let x=rm.x0;x<=rm.x1;x++)T[y*MW+x]=0;});
  // items: mirrored pairs share a type
  const kinds=['heal','atk','def','chest','chest'];const items=[];
  const itemFor=new Array(rooms.length).fill(null);
  for(let i=0;i<rooms.length;i++){
    if(itemFor[i])continue;const rm=rooms[i];
    const cand=[];for(let y=rm.y0;y<=rm.y1;y++)for(let x=rm.x0;x<=rm.x1;x++)if(Math.abs(x-rm.cx)+Math.abs(y-rm.cy)>=1.5)cand.push([x,y]);
    const p=pick(cand),k=pick(kinds);
    itemFor[i]={tx:p[0],ty:p[1],kind:k,ri:i};
    const m=RMIR[i];if(m!==i)itemFor[m]={tx:MW-1-p[0],ty:p[1],kind:k,ri:m};
  }
  itemFor.forEach(it=>items.push({tx:it.tx,ty:it.ty,x:tcx(it.tx),y:tcy(it.ty),kind:it.kind,ri:it.ri,taken:false}));
  return {T,rooms,items};
}
const solidT=(tx,ty)=>tx<0||ty<0||tx>=MW||ty>=MH||MZ.T[ty*MW+tx]===1;
const solidAt=(x,y)=>solidT(tileX(x),tileY(y));
function clearLine(x0,y0,x1,y1,r){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(d/6));
  for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;
    if(solidAt(x,y)||(r&&(solidAt(x-r,y-r)||solidAt(x+r,y-r)||solidAt(x-r,y+r)||solidAt(x+r,y+r))))return false;}
  return true;
}
const DMC=new Map();
function distMap(tx,ty){
  const key=ty*MW+tx;let m=DMC.get(key);if(m)return m;
  m=new Int16Array(MW*MH).fill(-1);if(solidT(tx,ty)){DMC.set(key,m);return m;}
  const q=[key];m[key]=0;
  for(let h=0;h<q.length;h++){const c=q[h],cx=c%MW,cy=(c/MW)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(solidT(nx,ny))continue;const n=ny*MW+nx;if(m[n]<0){m[n]=m[c]+1;q.push(n);}}}
  DMC.set(key,m);return m;
}
function tileLos(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy,x=x0,y=y0;
  while(!(x===x1&&y===y1)){const e2=2*err;if(e2>-dy){err-=dy;x+=sx;}if(e2<dx){err+=dx;y+=sy;}if(x===x1&&y===y1)return true;if(solidT(x,y))return false;}
  return true;
}

function splitRoster(al,dl){
  const rest=SIGNS.filter(s=>s!==al&&s!==dl);
  const defs=[dl,...DEFPREF.filter(s=>rest.includes(s)).slice(0,4)];
  const atks=[al,...rest.filter(s=>!defs.includes(s))];
  return {atks,defs};
}

const $=id=>document.getElementById(id);
const IMG={};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t*t*(3-2*t)};
const eo=t=>{t=clamp(t);return 1-(1-t)*(1-t)};
const ei=t=>{t=clamp(t);return t*t};
const back=t=>{t=clamp(t);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(i);i.src=src;});}
async function loadAll(){
  const jobs=[];
  for(const s of SIGNS){IMG[s]={};for(const k of ['idle','e','w']){jobs.push(loadImg(SPR[s][k]).then(i=>{IMG[s][k]=i;}));}}
  await Promise.all(jobs);
}
let AC=null,muted=false;
function beep(f,d,type,v,f2){
  if(muted)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d);
  }catch(e){}
}

/* ---------- canvas drawing primitives ---------- */
const PX=n=>`${n}px 'Press Start 2P',ui-monospace,monospace`;
const VT=n=>`${n}px VT323,'Be Vietnam Pro',ui-monospace,monospace`;
function txt(c,s,x,y,font,col,align,out){
  c.font=font;c.textAlign=align||'center';c.textBaseline='middle';
  if(out){c.lineJoin='round';c.lineWidth=out.w||4;c.strokeStyle=out.c||'#0c1130';c.strokeText(s,x,y);}
  c.fillStyle=col;c.fillText(s,x,y);
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function poly(c,n,r,rot){c.beginPath();for(let i=0;i<n;i++){const a=rot+i*Math.PI*2/n;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();}
function star(c,n,r1,r2,rot){c.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=rot+i*Math.PI/n;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();}

/* ---------- simulation ---------- */
let G=null;
const NOW=()=>performance.now();
const dist2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function newGame(){
  G={phase:'intro',t:0,units:[],sq:[null,null],flags:[],items:[],pts:[0,0],kills:[0,0],vis:[new Uint8Array(MW*MH),new Uint8Array(MW*MH)],itemSeen:[{},{}],K:[null,null],
     fx:[],banners:[],base:[-1,-1],sel:{atk:null,def:null,mode:'atk'},ctrl:'atk',combat:false,keys:{u:0,d:0,l:0,r:0},interact:0,speed:1,paused:false,acc:0,leadQ:[],choose:null,alarm:[false,false],alarmT:0,cam:null,over:null,nextIncome:INCOME_EVERY,incomeFlash:0,visT:0,hint:0,botT:0,roomSel:-1,hover:-1};
}
const alive=t=>G.units.filter(u=>u.team===t&&u.alive);
function msg(text,team,big){G.banners.push({text,team,t0:NOW(),big:!!big});if(G.banners.length>3)G.banners.shift();}
function addFx(k,a,b,col,text){
  if(k==='text'&&a){const n=NOW();if(a.lt&&n-a.lt<260&&!isNaN(+text))return;a.lt=n;}
  G.fx.push({k,a,b,col,text,t0:NOW(),life:k==='text'?1000:k==='ko'?1500:560});
}
const roomOf=(x,y)=>{const tx=tileX(x),ty=tileY(y);return MZ.rooms.findIndex(r=>tx>=r.x0&&tx<=r.x1&&ty>=r.y0&&ty<=r.y1);};
const homePx=t=>{const r=MZ.rooms[G.base[t]];return [tcx(r.cx),tcy(r.cy)];};
function buildBattle(){
  G.units=[];const bot=G.sel.bot;
  const picks=[[G.sel.atk,G.sel.def],[bot.atk,bot.def]];
  for(const t of [0,1]){
    const [al,dl]=picks[t];
    const {atks,defs}=(t===0&&G.sel.ord)?{atks:G.sel.ord.atk,defs:G.sel.ord.def}:splitRoster(al,dl);
    const [hx,hy]=homePx(t);
    const mk=(s,role,k,n)=>{const st=ST[s];
      const u={id:G.units.length,team:t,sign:s,el:EL[s],hp:st[0]*HPM,max:st[0]*HPM,atk:st[1],as:st[2],spd:st[3],range:st[4],alive:true,role,x:hx+((k%4)-1.5)*24,y:hy+(((k/4)|0)-1)*26,face:t?-1:1,
        atkT:rnd(0,.6),skT:rnd(1,2.2),b:{},carry:false,flash:0,lunge:0,trail:[],moving:false,lt:0,tx:0,ty:0,lastTeam:null,leader:false};
      G.units.push(u);return u;};
    const A=atks.map((s,i)=>mk(s,'atk',i)),D=defs.map((s,i)=>mk(s,'def',i+7));
    A[0].leader=true;D[0].leader=true;
    G.sq[t]={atk:A,def:D,rt:{atk:0,def:0}};
    // guard slots for defenders (offsets from flag spot)
    D.forEach((u,i)=>{u.slot=[[0,26],[-30,-16],[30,-16],[-30,16],[30,16]][i];});
    G.K[t]={visited:new Array(MZ.rooms.length).fill(false),goalRoom:-1,goalT:0,found:false,healing:false};
  }
  G.flags=[0,1].map(t=>{const [x,y]=homePx(t);return {team:t,state:'home',x,y,hx:x,hy:y,carrier:null,holder:null};});
  G.items=MZ.items.map(i=>Object.assign({},i,{taken:false}));
  G.t=0;G.pts=[0,0];G.kills=[0,0];G.nextIncome=INCOME_EVERY;G.over=null;G.phase='battle';G.ctrl='atk';G.combat=false;
  updateVis(true);
}
const leaderOf=(t,role)=>G.sq[t][role].find(u=>u.alive&&u.leader)||null;
function promote(t,role){
  const L=G.sq[t][role];if(L.some(u=>u.alive&&u.leader))return;
  const c=L.find(u=>u.alive);if(!c)return;
  c.leader=true;c.trail=[];
  if(t===0){msg(`${VN[c.sign]} becomes the ${role==='atk'?'attack':'defense'} leader`,0);beep(600,.08,'triangle',.04);}
}
/* ---- movement ---- */
function tryMove(u,dx,dy){
  const h=8;
  const ok=(x,y)=>!(solidAt(x-h,y-h)||solidAt(x+h,y-h)||solidAt(x-h,y+h)||solidAt(x+h,y+h));
  if(dx&&ok(u.x+dx,u.y))u.x+=dx;
  if(dy&&ok(u.x,u.y+dy))u.y+=dy;
}
function moveToward(u,tx,ty,mul,dt){
  if(u.b.stun>0){u.moving=false;return;}
  const d=Math.hypot(tx-u.x,ty-u.y);
  if(d<2){u.moving=false;return;}
  let gx=tx,gy=ty;
  if(!clearLine(u.x,u.y,tx,ty,7)){
    const dm=distMap(tileX(tx),tileY(ty)),cx=tileX(u.x),cy=tileY(u.y);
    let bd=dm[cy*MW+cx],bx=-1,by=-1;
    if(bd>0)for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+ox,ny=cy+oy;if(solidT(nx,ny))continue;const v=dm[ny*MW+nx];if(v>=0&&v<bd){bd=v;bx=nx;by=ny;}}
    if(bx>=0){gx=tcx(bx);gy=tcy(by);}
  }
  const sp=u.spd*mul*(u.b.slowT>0?.6:1)*(u.carry?.8:1)*dt,L=Math.hypot(gx-u.x,gy-u.y)||1,m=Math.min(sp,d);
  tryMove(u,(gx-u.x)/L*m,(gy-u.y)/L*m);
  u.face=(gx-u.x)>=0?1:-1;if(Math.abs(gx-u.x)<1)u.face=u.face||1;u.moving=true;
}
function trailPoint(L,need){
  let px=L.x,py=L.y,cum=0;
  for(let i=L.trail.length-1;i>=0;i--){const p=L.trail[i],seg=Math.hypot(p.x-px,p.y-py);
    if(cum+seg>=need){const f=(need-cum)/(seg||1);return [px+(p.x-px)*f,py+(p.y-py)*f];}
    cum+=seg;px=p.x;py=p.y;}
  return [px,py];
}
function pushTrail(u){
  const l=u.trail[u.trail.length-1];
  if(!l||Math.hypot(l.x-u.x,l.y-u.y)>=5){u.trail.push({x:u.x,y:u.y});if(u.trail.length>260)u.trail.shift();}
}
/* ---- combat ---- */
function calcDmg(u,t,m){
  let d=u.atk*m*emul(u.el,t.el);
  if(u.b.atkT>0)d*=1+u.b.atk;
  if(u.b.iatkT>0)d*=1.25;
  if(t.b.drT>0)d*=.5;
  if(t.b.guardT>0)d*=.75;
  if(t.b.idefT>0)d*=.8;
  return d;
}
function damage(src,t,d,col,quiet){
  if(!t.alive||d<=0)return;
  if(t.b.shieldT>0&&t.b.shield>0){const a=Math.min(t.b.shield,d);t.b.shield-=a;d-=a;}
  if(src)t.lastTeam=src.team;
  if(d>0){t.hp-=d;if(!quiet){t.flash=1;if(d>=1)addFx('text',t,null,col||'#fff',String(Math.round(d)));}}
  if(src&&!quiet&&t.b.reflectT>0&&src.alive){src.hp-=d*.3;src.flash=1;if(src.hp<=0)kill(src,t);}
  if(t.hp<=0)kill(t,src);
}
function kill(t,by){
  if(!t.alive)return;t.alive=false;t.hp=0;
  const kt=by?by.team:t.lastTeam;if(kt!=null&&kt!==t.team)G.kills[kt]++;
  addFx('ko',t);if(t.carry)dropFlag(t);
  if(t.leader){t.leader=false;promote(t.team,t.role);}
}
function heal(t,a){if(!t.alive)return;const h=Math.min(a,t.max-t.hp);if(h>.5){t.hp+=h;addFx('text',t,null,'#7dff9a','+'+Math.round(h));}}
const enemiesNear=(u,r)=>G.units.filter(e=>e.alive&&e.team!==u.team&&dist2(u,e)<=r).sort((a,b)=>dist2(u,a)-dist2(u,b));
const alliesNear=(u,r)=>G.units.filter(e=>e.alive&&e.team===u.team&&dist2(u,e)<=r);
function nearestEnemy(u,px,tiles){
  const dm=distMap(tileX(u.x),tileY(u.y));let best=null,bd=1e9;
  for(const e of G.units){if(!e.alive||e.team===u.team)continue;const d=dist2(u,e);if(d>px)continue;
    const pd=dm[tileY(e.y)*MW+tileX(e.x)];if(pd<0||pd>tiles)continue;
    const w=d-(e.b.taunt>0?60:0)-(e.carry?25:0);if(w<bd){bd=w;best=e;}}
  return best;
}
function skillCast(u,t){
  const s=u.sign,col=ELC[u.el];
  const label=()=>{if(u.leader)addFx('text',u,null,col,SKI[s][0]);};
  const hit=(x,m,c)=>{damage(u,x,calcDmg(u,x,m),c||col);addFx('burst',x,null,col);};
  const near=(r,n)=>enemiesNear(u,r).filter(e=>clearLine(u.x,u.y,e.x,e.y,0)).slice(0,n);
  switch(s){
    case 'aries':label();hit(t,2.2);t.b.burnT=3;break;
    case 'leo':label();alliesNear(u,110).forEach(a=>{a.b.atk=.3;a.b.atkT=6;addFx('ring',a,null,col);});hit(t,1);break;
    case 'sagittarius':label();near(130,2).forEach(e=>{hit(e,1.5);addFx('beam',u,e,col);});break;
    case 'taurus':label();u.b.taunt=4;u.b.drT=4;addFx('ring',u,null,col);hit(t,1);break;
    case 'virgo':{const w=alliesNear(u,100).filter(a=>a.hp<a.max*.85).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];if(!w)return false;label();heal(w,30*HPM);addFx('beam',u,w,'#7dff9a');break;}
    case 'capricorn':label();t.b.stun=2;hit(t,1);break;
    case 'gemini':label();u.b.shield=45*HPM;u.b.shieldT=5;addFx('ring',u,null,col);hit(t,1);break;
    case 'libra':label();alliesNear(u,110).forEach(a=>{a.b.guardT=5;addFx('ring',a,null,col);});hit(t,1);break;
    case 'aquarius':label();near(120,3).forEach(e=>{hit(e,1.1);addFx('beam',u,e,col);});break;
    case 'cancer':label();u.b.reflectT=5;addFx('ring',u,null,col);hit(t,1);break;
    case 'scorpio':label();t.b.poisonT=5;hit(t,1,'#9be36a');break;
    case 'pisces':label();enemiesNear(u,80).forEach(e=>{e.b.slowT=4;hit(e,.8);});break;
  }
  return true;
}
function tryAttack(u,t){
  if(u.atkT>0||u.b.stun>0||!t||!t.alive)return false;
  if(dist2(u,t)>u.range||!clearLine(u.x,u.y,t.x,t.y,0))return false;
  u.face=t.x>=u.x?1:-1;
  let did=false;
  if(u.skT<=0){did=skillCast(u,t);if(did)u.skT=SKCD;}
  if(!did){damage(u,t,calcDmg(u,t,1),null);if(u.range>40)addFx('beam',u,t,'#ffffff');addFx('burst',t,null,'#ffffff');}
  u.lunge=1;u.atkT=u.as*(u.b.slowT>0?1.4:1);return true;
}
/* ---- control / AI ---- */
function setLeaderInput(L,dt){
  if(L.b.stun>0){L.moving=false;return;}
  const k=G.keys;let dx=k.r-k.l,dy=k.d-k.u;
  if(!dx&&!dy){L.moving=false;return;}
  const n=Math.hypot(dx,dy);const sp=L.spd*(L.b.slowT>0?.6:1)*(L.carry?.8:1)*dt;
  tryMove(L,dx/n*sp,dy/n*sp);L.moving=true;if(dx)L.face=dx>0?1:-1;
}
function fightOrFollow(u,L,idx,t,role){
  const rt=G.sq[t].rt[role]>0;
  if(u.b.stun>0)return;
  if(rt){const [sx,sy]=trailPoint(L,(idx+1)*17);moveToward(u,sx,sy,1.35,SIMDT);return;}
  const e=nearestEnemy(u,150,7);
  if(e){
    if(dist2(u,e)<=u.range*.9&&clearLine(u.x,u.y,e.x,e.y,0)){u.moving=false;tryAttack(u,e);}
    else moveToward(u,e.x,e.y,1,SIMDT);
    return;
  }
  const [sx,sy]=trailPoint(L,(idx+1)*17),d=Math.hypot(sx-u.x,sy-u.y);
  moveToward(u,sx,sy,d>40?1.5:1,SIMDT);
}
function guardUnit(u,t){
  if(u.b.stun>0)return;
  const [fx,fy]=homePx(t),sx=fx+(u.slot?u.slot[0]:0),sy=fy+(u.slot?u.slot[1]:0);
  const e=nearestEnemy(u,170,7);
  if(e&&(dist2(e,{x:fx,y:fy})<190||dist2(u,e)<110)){
    if(dist2(u,e)<=u.range*.9&&clearLine(u.x,u.y,e.x,e.y,0)){u.moving=false;tryAttack(u,e);}else moveToward(u,e.x,e.y,1,SIMDT);
  }else moveToward(u,sx,sy,1,SIMDT);
}
function rescueLeader(t,L){
  if(L.b.stun>0)return;
  const e=nearestEnemy(L,150,7);
  if(e){if(dist2(L,e)<=L.range*.9&&clearLine(L.x,L.y,e.x,e.y,0)){L.moving=false;tryAttack(L,e);}else moveToward(L,e.x,e.y,1,SIMDT);return;}
  const h=homePx(t);moveToward(L,h[0],h[1],1,SIMDT);
}
function thinkTeam(t){
  const S=G.sq[t];
  for(const role of ['atk','def']){
    const L=leaderOf(t,role);if(!L)continue;
    const human=t===0&&G.ctrl===role;
    S.rt[role]=Math.max(0,S.rt[role]-SIMDT);
    if(human){
      setLeaderInput(L,SIMDT);
      if(G.combat&&L.b.stun<=0){const e=nearestEnemy(L,130,6);if(e){if(!(G.keys.u||G.keys.d||G.keys.l||G.keys.r)&&dist2(L,e)>L.range*.9)moveToward(L,e.x,e.y,1,SIMDT);tryAttack(L,e);}}
    }else if(role==='atk'&&G.alarm[t]&&!L.carry&&roomOf(L.x,L.y)!==G.base[t])rescueLeader(t,L);
    else if(role==='atk'||(t===1&&!S.atk.some(u=>u.alive)))aiLeader(t,L);
    else guardUnit(L,t);
    pushTrail(L);
    const fol=S[role].filter(u=>u.alive&&u!==L);
    fol.forEach((u,i)=>{
      if(role==='atk'||human||(t===1&&!S.atk.some(a=>a.alive)))fightOrFollow(u,L,i,t,role);else guardUnit(u,t);
    });
  }
}

/* ---------- AI, flags, items, step ---------- */
function exploreGoal(t,L){
  const K=G.K[t];
  // visible, reachable pickups first
  const dm=distMap(tileX(L.x),tileY(L.y));let bi=-1,bd=13;
  G.items.forEach((it,i)=>{if(it.taken||!G.itemSeen[t][i])return;const d=dm[it.ty*MW+it.tx];if(d>=0&&d<bd){bd=d;bi=i;}});
  if(bi>=0)return [G.items[bi].x,G.items[bi].y];
  const bad=r=>r===G.base[t]||K.visited[r];
  if(K.goalRoom<0||bad(K.goalRoom)||G.t>K.goalT){
    let best=-1,b=1e9;
    MZ.rooms.forEach((rm,i)=>{if(bad(i))return;const d=dm[rm.cy*MW+rm.cx];if(d>=0&&d+Math.random()*4<b){b=d;best=i;}});
    if(best<0){K.visited.fill(false);best=(Math.random()*MZ.rooms.length)|0;}
    K.goalRoom=best;K.goalT=G.t+40;
  }
  const rm=MZ.rooms[K.goalRoom];return [tcx(rm.cx),tcy(rm.cy)];
}
function aiLeader(t,L){
  if(L.b.stun>0)return;
  const K=G.K[t],ef=G.flags[1-t],mf=G.flags[t],S=G.sq[t];
  const e=!L.carry?nearestEnemy(L,150,7):null;
  if(e&&!(K.healing)){
    if(dist2(L,e)<=L.range*.9&&clearLine(L.x,L.y,e.x,e.y,0)){L.moving=false;tryAttack(L,e);}else moveToward(L,e.x,e.y,1,SIMDT);
    return;
  }
  const A=S.atk.filter(u=>u.alive),avg=A.reduce((a,u)=>a+u.hp/u.max,0)/Math.max(1,A.length);
  if(K.healing&&avg>.85)K.healing=false;
  if(!K.healing&&avg<.4&&!L.carry)K.healing=true;
  let g;
  if(L.carry||K.healing)g=homePx(t);
  else if(mf.state==='stored'||mf.state==='dropped')g=[mf.x,mf.y];
  else if(ef.state==='dropped')g=[ef.x,ef.y];
  else if(ef.state==='home'&&K.found)g=[ef.x,ef.y];
  else g=exploreGoal(t,L);
  moveToward(L,g[0],g[1],1,SIMDT);
  if(!L.carry)tryInteract(L);
}
function tryInteract(L){
  if(!L.alive||!L.leader||L.carry)return false;
  for(const f of G.flags){
    if(f.state==='carried'||Math.hypot(f.x-L.x,f.y-L.y)>26)continue;
    const T=L.team,steal=f.team!==T&&(f.state==='home'||f.state==='dropped'),retake=f.team===T&&f.state==='stored';
    if(steal||retake){
      f.state='carried';f.carrier=L;L.carry=true;f.holder=null;
      msg(steal?`${TNAME[T]} picked up the ${TNAME[f.team]} flag!`:`${TNAME[T]} is recovering its flag!`,T,true);return true;
    }
  }
  return false;
}
function dropFlag(u){
  const f=G.flags.find(f=>f.carrier===u);if(!f)return;
  f.state='dropped';f.x=u.x;f.y=u.y;f.carrier=null;u.carry=false;
  msg(`The ${TNAME[f.team]} flag was dropped!`,1-f.team,true);
}
function flagStep(){
  for(const f of G.flags){
    const T=f.team;
    if(f.state==='carried'){
      const c=f.carrier;if(!c||!c.alive)continue;
      f.x=c.x;f.y=c.y-8;const ct=c.team;
      if(roomOf(c.x,c.y)===G.base[ct]){
        c.carry=false;f.carrier=null;
        if(ct!==T){const [hx,hy]=homePx(ct);f.state='stored';f.holder=ct;f.x=hx+22;f.y=hy+24;G.pts[ct]+=10;msg(`${TNAME[ct]} CAPTURED THE ${TNAME[T]} FLAG!  +10`,ct,true);}
        else{f.state='home';f.x=f.hx;f.y=f.hy;f.holder=null;msg(`The ${TNAME[T]} flag is safely home`,T,true);}
      }
    }else if(f.state==='dropped'&&G.units.some(u=>u.alive&&u.team===T&&Math.hypot(u.x-f.x,u.y-f.y)<22)){
      f.state='home';f.x=f.hx;f.y=f.hy;msg(`The ${TNAME[T]} flag was returned`,T);
    }
  }
}
function itemStep(){
  for(const it of G.items){
    if(it.taken)continue;
    const u=G.units.find(u=>u.alive&&Math.hypot(u.x-it.x,u.y-it.y)<15);if(!u)continue;
    it.taken=true;
    let kind=it.kind;if(kind==='chest')kind=pick(['heal','atk','def']);
    const sq=G.sq[u.team][u.role].filter(x=>x.alive);
    const nm={heal:'healing',atk:'attack boost',def:'defense boost'}[kind];
    sq.forEach(x=>{
      if(kind==='heal')heal(x,x.max*.4);else if(kind==='atk'){x.b.iatkT=45;addFx('ring',x,null,'#ffb24d');}else{x.b.idefT=45;addFx('ring',x,null,'#5ab0ff');}
    });
    addFx('text',u,null,'#fff',(it.kind==='chest'?'Chest: ':'')+nm);
    if(u.team===0)msg(`Picked up ${it.kind==='chest'?'a chest':'an item'}: ${nm} for the whole ${u.role==='atk'?'attack':'defense'} squad`,0);
  }
}
function unitTimers(dt){
  for(const u of G.units){
    if(!u.alive)continue;
    for(const k of ['atkT','taunt','drT','guardT','reflectT','stun','slowT','burnT','poisonT','shieldT','iatkT','idefT'])if(u.b[k]>0)u.b[k]-=dt;
    u.atkT-=dt;u.skT-=dt;
    if(u.b.burnT>0)damage(null,u,4*dt,null,true);
    if(u.b.poisonT>0)damage(null,u,5*dt,null,true);
    if(!u.alive)continue;
    if(u.flash>0)u.flash=Math.max(0,u.flash-dt*4);
    if(u.lunge>0)u.lunge=Math.max(0,u.lunge-dt*5);
    const hot=G.units.some(e=>e.alive&&e.team!==u.team&&dist2(u,e)<160);
    const inb=roomOf(u.x,u.y)===G.base[u.team];
    if(!hot){
      if(inb&&u.hp<u.max){const h=Math.min(u.max-u.hp,u.max*.04*dt);u.hp+=h;u.regT=(u.regT||0)+h;
        if(u.regT>=u.max*.05){addFx('text',u,null,'#7dff9a','+'+Math.round(u.regT));u.regT=0;}}
      else u.hp=Math.min(u.max,u.hp+.25*dt);
    }
  }
}
function separate(){
  const L=G.units.filter(u=>u.alive);
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
    const a=L[i],b=L[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<11&&d>.01){const p=(11-d)*.35,nx=dx/d,ny=dy/d;tryMove(a,-nx*p,-ny*p);tryMove(b,nx*p,ny*p);}
    else if(d<=.01){tryMove(b,.6,.3);}
  }
}
function updateVis(){
  for(const t of [0,1]){
    const v=G.vis[t];v.fill(0);const seen=new Set();
    for(const u of G.units){
      if(!u.alive||u.team!==t)continue;
      const ux=tileX(u.x),uy=tileY(u.y),k=uy*MW+ux;if(seen.has(k))continue;seen.add(k);
      for(let dy=-6;dy<=6;dy++)for(let dx=-6;dx<=6;dx++){
        if(dx*dx+dy*dy>40)continue;const x=ux+dx,y=uy+dy;if(x<0||y<0||x>=MW||y>=MH)continue;
        if(v[y*MW+x]||tileLos(ux,uy,x,y))v[y*MW+x]=1;
      }
    }
    const K=G.K[t];
    MZ.rooms.forEach((rm,i)=>{if(v[rm.cy*MW+rm.cx])K.visited[i]=true;});
    const ef=G.flags[1-t],hk=tileY(ef.hy)*MW+tileX(ef.hx);if(v[hk])K.found=true;
    G.items.forEach((it,i)=>{if(v[it.ty*MW+it.tx])G.itemSeen[t][i]=true;});
  }
}
function endGame(wipe){
  const a=[0,1].map(t=>alive(t).length);let w=-1,why='';
  const byK=()=>G.kills[0]>G.kills[1]?0:G.kills[1]>G.kills[0]?1:-1;
  if(wipe){w=a[0]?0:1;why='All enemy units were defeated';}
  else if(G.flags.every(f=>f.state!=='home')){why='Time is up and both flags are lost: decided by kills';w=byK();}
  else{why='Time is up: decided by points';w=G.pts[0]>G.pts[1]?0:G.pts[1]>G.pts[0]?1:-1;if(w<0){why='Tied on points: decided by kills';w=byK();}}
  G.over={w,why};G.phase='over';
}
function step(dt){
  G.t+=dt;
  if(G.interact){G.interact=0;const L=leaderOf(0,G.ctrl);if(!(L&&tryInteract(L)))msg('No flag nearby to pick up',0);}
  thinkTeam(0);thinkTeam(1);separate();
  unitTimers(dt);flagStep();itemStep();
  G.visT-=dt;if(G.visT<=0){G.visT=.2;updateVis();
    for(const t of [0,1]){
      const raid=G.units.some(u=>u.alive&&u.team!==t&&roomOf(u.x,u.y)===G.base[t]);
      if(raid&&!G.alarm[t]&&t===0){msg('⚠ FLAG ROOM UNDER ATTACK! Press Q to command the defense',0,true);beep(220,.25,'sawtooth',.06);}
      G.alarm[t]=raid;
    }
  }
  if(G.t>=G.nextIncome){
    G.nextIncome+=INCOME_EVERY;
    for(const t of [0,1]){let d=0;if(G.flags[t].state==='home')d+=2;const e=G.flags[1-t];if(e.state==='stored'&&e.holder===t)d+=1;G.pts[t]+=d;}
    G.incomeFlash=NOW();
  }
  if([0,1].some(t=>!alive(t).length))endGame(true);
  else if(G.t>=MATCH)endGame(false);
}
function doRetreat(){G.sq[0].rt[G.ctrl]=4;G.combat=false;msg('Retreat! The squad is regrouping',0);}
function switchCtrl(){G.ctrl=G.ctrl==='atk'?'def':'atk';G.keys={u:0,d:0,l:0,r:0};msg(G.ctrl==='atk'?'Controlling the ATTACK leader':'Controlling the DEFENSE leader',0);}

const cv=$('cv'),ctx=cv.getContext('2d');
const tmp=document.createElement('canvas');tmp.width=tmp.height=96;const tctx=tmp.getContext('2d');
const SCM=.6;
let BGc=null;
function buildBG(){
  const c=document.createElement('canvas');c.width=W*Z;c.height=H*Z;const x=c.getContext('2d');x.scale(Z,Z);x.imageSmoothingEnabled=false;
  x.fillStyle='#090c24';x.fillRect(0,0,W,H);
  const T=MZ.T,inRoom=new Uint8Array(MW*MH);
  MZ.rooms.forEach(r=>{for(let y=r.y0;y<=r.y1;y++)for(let X=r.x0;X<=r.x1;X++)inRoom[y*MW+X]=1;});
  const R=(a=>()=>{a=(a*1664525+1013904223)>>>0;return a/4294967296;})(11);
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    const px=OX+tx*TS,py=OY+ty*TS,k=ty*MW+tx;
    if(T[k]){
      x.fillStyle='#2a2147';x.fillRect(px,py,TS,TS);
      x.fillStyle='#3d3166';x.fillRect(px,py,TS,5);
      if(R()<.35){x.fillStyle='#211a3b';x.fillRect(px+4+((R()*16)|0),py+8+((R()*10)|0),8,4);}
      const below=ty+1<MH&&!T[(ty+1)*MW+tx];
      if(below){x.fillStyle='#17122b';x.fillRect(px,py+TS-9,TS,9);x.fillStyle='#0a0818';x.fillRect(px,py+TS-2,TS,2);}
    }else{
      const room=inRoom[k];
      x.fillStyle=room?((tx+ty)%2?'#6a67b8':'#6360b0'):((tx+ty)%2?'#4a5b9c':'#445492');x.fillRect(px,py,TS,TS);
      x.fillStyle=room?'rgba(255,255,255,.05)':'rgba(255,255,255,.03)';x.fillRect(px+2,py+2,TS-4,2);
      if(R()<.12){x.fillStyle='rgba(0,0,10,.18)';x.fillRect(px+((R()*20)|0)+2,py+((R()*20)|0)+2,5,3);}
    }
  }
  // room labels
  MZ.rooms.forEach(r=>{x.font=VT(20);x.textAlign='center';x.textBaseline='middle';x.fillStyle='rgba(255,255,255,.10)';x.fillText(r.num,tcx(r.cx),tcy(r.cy)-0);});
  return c;
}

const CZ=2;

    if(h)txt(c,h,clamp(ctrlL.x,G.cam.x+70,G.cam.x+W/CZ-70),ctrlL.y-40,VT(12),'#fff','center',{w:3});}
  drawFx(c,V,now);
  if(G.alarm[0]){const r=MZ.rooms[G.base[0]];c.save();c.globalAlpha=.5+.4*Math.sin(now/120);roomRect(c,r,'#ff4d4d','rgba(255,60,60,.12)',3);c.restore();}
  c.setTransform(Z,0,0,Z,0,0);

    txt(c,G.ctrl==='def'?'⚠ FLAG UNDER ATTACK - the attack squad is returning to help':'⚠ FLAG UNDER ATTACK - press Q to command the defense squad',W/2,H-122,VT(22),'#ff8a8a','center',{w:5});}
  drawHUD(c);drawBanners(c,now);

  const tx=tileX(x),ty=tileY(y);return {i:MZ?MZ.rooms.findIndex(rm=>tx>=rm.x0&&tx<=rm.x1&&ty>=rm.y0&&ty<=rm.y1):-1,x,y};

  if(!G||G.phase!=='room'){$('tip').hidden=true;return;}
  const {i,x,y}=roomAt(e);G.hover=i;const tip=$('tip');
  if(i<0){tip.hidden=true;cv.style.cursor='default';return;}
  const rm=MZ.rooms[i];tip.innerHTML=i===5?`<b style="color:#f3c75a">${rm.name}</b><br>Central room, cannot be chosen as a base.`:`<b style="color:#f3c75a">${rm.name}</b><br>Click to choose as your base: the flag and its guards stay here.`;
  tip.style.left=Math.min(x+14,W-250)+'px';tip.style.top=Math.min(y+12,MAP_BOT-60)+'px';tip.hidden=false;cv.style.cursor=i===5?'default':'pointer';
});
cv.addEventListener('mouseleave',()=>{$('tip').hidden=true;});
cv.addEventListener('click',e=>{
  if(!G||G.phase!=='room')return;const {i}=roomAt(e);
  if(i>=0&&i!==5){G.roomSel=i;$('rok').disabled=false;beep(520,.05,'square',.03);}
});
const KM={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
document.addEventListener('keydown',e=>{
  if(!G||G.phase!=='battle')return;
  if(KM[e.code]){e.preventDefault();G.keys[KM[e.code]]=1;}
  else if(e.code==='KeyE'||e.code==='Space'){e.preventDefault();G.interact=1;}
  else if(e.code==='KeyQ'||e.code==='Tab'){e.preventDefault();switchCtrl();}
  else if(e.code==='KeyR'){doRetreat();}
  else if(e.code==='KeyF'){G.combat=!G.combat;}
});
document.addEventListener('keyup',e=>{if(G&&KM[e.code])G.keys[KM[e.code]]=0;});
window.addEventListener('blur',()=>{if(G)G.keys={u:0,d:0,l:0,r:0};});
/* loop */
let lastT=0,barT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!G)return;
  const dt=Math.min(.1,(now-(lastT||now))/1000);lastT=now;
  if(G.phase==='battle')leadTick();
  if(G.phase==='battle'&&!G.paused&&!G.choose){
    G.acc+=dt*G.speed;let n=0;
    while(G.acc>=SIMDT&&n<800){step(SIMDT);G.acc-=SIMDT;n++;if(G.phase!=='battle'||G.leadQ.length)break;}
  }
  if(G.phase==='over'&&$('result').hidden)showResult();
  if(G.phase==='battle'&&now-barT>150){barT=now;updateBar();}
  render(now);
}
function fit(){
  const wrap=$('wrap'),cs=getComputedStyle(wrap),portrait=window.innerHeight>window.innerWidth;
  $('hint').hidden=!portrait;
  const aw=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-(portrait?$('hint').offsetHeight+8:0);
  const s=Math.max(.2,Math.min(aw/W,ah/H));
  $('stage').style.width=Math.floor(W*s)+'px';$('stage').style.height=Math.floor(H*s)+'px';$('game').style.transform=`scale(${s})`;
}
async function loadAll(){
  const jobs=[];
  for(const s of SIGNS){IMG[s]={};for(const k of ['idle','e','w'])jobs.push(loadImg(SPR[s][k]).then(i=>{IMG[s][k]=i;}));}
  await Promise.all(jobs);
}
async function boot(){
  try{await Promise.race([Promise.all([document.fonts.load("16px 'Press Start 2P'"),document.fonts.load('20px VT323'),document.fonts.load('20px VT323','ĐỎ XANH CỜ'),document.fonts.load("16px 'Be Vietnam Pro'",'ĐỎ XANH CỜ ƯỜỞ')]),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
  await loadAll();
  MZ=genMaze();BGc=buildBG();
  window.addEventListener('resize',fit);fit();
  showIntro();
  window.__mz={rescueLeader,kill:(u)=>kill(u,null),leadTick,pickLeader,test:()=>({splitRoster}),getG:()=>G,getMZ:()=>MZ,step,showSel,showRoom,finishRoom,buildBattle,leaderOf,switchCtrl,doRetreat,tryInteract,splitRoster};
  requestAnimationFrame(frame);
}
boot();

})();
</script>
